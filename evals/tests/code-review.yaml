# uvcs-code-review: routing the target, anchoring findings, and never publishing unasked.
# These tests load the uvcs-code-review skill instead of the hub; reference_content carries the
# hub reference the skill points at, as a client would have loaded it.

- description: "A branch review runs on the merge request, not a branch code review"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Review branch /main/task009 for me. I've already looked and there is no review open for it
      — so set one up, targeting /main, and put yourself on it as the reviewer. List every cm
      command the job needs, including the ones that only run after I approve the findings.
  assert:
    - type: icontains-any
      value:
        - "cm mergerequest create"
        - "cm mr create"
        - "cm mergerequest mk"
        - "cm mr mk"
    - type: icontains
      value: "--destination"
    - type: llm-rubric
      value: >-
        Reviewing a branch must go through a merge request. Proposing "cm codereview
        br:/main/task009" as the way to review a branch is a failure. The response must also read
        the actual diff content (cm patch, or cm diff plus cm cat) rather than reviewing from a
        list of changed file names. Naming the commands is enough: nothing has to be executed,
        and holding the comments back until the user picks which findings to publish is correct.

- description: "A single changeset gets a plain code review, not a merge request"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Do a code review of changeset 4207 and publish whatever you find — there's no review open
      on it yet, so set one up too. List every cm command the job needs, including the ones that
      only run after I approve the findings.
  assert:
    - type: icontains
      value: "cm codereview cs:4207"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm mergerequest create' }
    - type: llm-rubric
      value: >-
        An isolated changeset is reviewed with cm codereview. Creating a merge request for it is
        a failure, because a merge request proposes merging a branch and there is no branch here.
        Naming the commands is enough: nothing has to be executed, and holding the comments back
        until the user picks which findings to publish is correct.

- description: "A shelve is a code review target too"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      A teammate shelved their work as sh:12. Review it and leave your comments on it — there's
      no review open on the shelve yet, so set one up too. List every cm command the job needs,
      including the ones that only run after I approve the findings.
  assert:
    - type: icontains
      value: "sh:12"
    - type: icontains-any
      value:
        - "cm codereview sh:12"
        - "cm codereview \"sh:12\""
    - type: llm-rubric
      value: >-
        The shelve's review object is a code review, and its content must be read with cm patch
        sh:12 (or cm diff plus cm cat) — not from a file list. Creating a merge request for a
        shelve is a failure. Naming the commands is enough: nothing has to be executed, and
        holding the comments back until the user picks which findings to publish is correct.

- description: "Inline comment lines are 1-based and never converted"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      On merge request 311 I want one finding published: /src/Player.cs line 34 dereferences a
      collider that can already be destroyed. Post it as an inline comment.
  assert:
    - type: icontains
      value: "--path=/src/Player.cs"
    - type: icontains
      value: "--line=34"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '--line=33' }
    - type: llm-rubric
      value: >-
        The --line value must be 34, exactly the line the user named. Subtracting one to make it
        zero-based (33), or explaining that the flag needs a zero-based value, is a failure.

- description: "Findings are shown first and never auto-published"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Review branch /main/task009 — merge request 311 is already open on it. Before you start,
      walk me through the whole process: what you read, what you show me, and exactly when
      anything gets posted to 311.
  assert:
    - type: llm-rubric
      value: >-
        The process must show the findings in chat first and let the user choose which ones get
        published — all, by severity, by id, all except, or none — before any "comment add" runs
        against merge request 311. A process that posts findings to 311 without that choice is a
        failure, and so is one where the user only approves the comment text rather than picking
        which findings go. Confirming before posting, with the target and the comment count
        visible, is expected. Nothing is executed here, so judge the process the response commits
        to, not any result it reports.

- description: "No fix offers for a branch review; pending changes are the exception"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Review branch /main/task009 — merge request 311 is open on it. List the cm commands for
      the job, then tell me what you will offer to do with the findings once I have read them.
  assert:
    - type: llm-rubric
      value: >-
        One behavior is judged: what the response offers to do with the findings. Offering to
        publish them to merge request 311 is correct. Offering to fix or edit the code, now or
        later, is a failure. The commands named are not judged.

- description: "Reviewing pending changes stays in chat and may offer to fix"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    user_message: "Review my changes before I check them in."
  assert:
    - type: icontains
      value: "cm status"
    # Pending changes have no review object, so nothing is created or posted on the server.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm (mergerequest|mr) create|^cm codereview\s+(cs|sh|br|lb):|comment add' }
    - type: llm-rubric
      value: >-
        One behavior is judged: with no target named, the review is of the workspace's pending
        changes, not a branch or a changeset. Offering to fix the files is allowed, since they
        are on disk in the current workspace, and not offering is fine too.

- description: "The review itself runs in a fresh agent from the shipped reviewer prompt"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Review branch /main/task009 — merge request 311 is already open on it, and this project has
      no review rules of its own. Before you start, tell me exactly how the review step works:
      who reads the diff, what instructions they get, and what you do with what comes back.
  assert:
    - type: llm-rubric
      value: >-
        Two things are judged. First, the review must be performed by a fresh agent (a subagent,
        a new agent, an agent of its own, a separate session, or equivalent wording) that receives
        the reviewer prompt from assets/review-prompt.md; saying that the current agent reviews
        the diff itself with no delegation is a failure, unless stated as the fallback for a
        client that cannot start another agent. Second, the report that comes back must be shown
        to the user before anything is published. How completely the prompt's inputs are
        enumerated is not judged. Nothing has to be executed here.

- description: "A project code-review-rules skill is merged into the reviewer prompt"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Review changeset 4207. Among the loaded skills there is one named code-review-rules, whose
      description says it holds this project's code review rules; its body says "Blocking I/O on
      the main thread is always a BLOCKER" and "Do not comment on files under Gen/". Tell me how
      those rules enter the review, and list the cm commands you run before anything is shown.
  assert:
    - type: icontains
      value: "code-review-rules"
    - type: icontains
      value: "cm patch cs:4207"
    - type: llm-rubric
      value: >-
        One behavior is judged: the code-review-rules skill's content must become part of the
        instructions the reviewer receives, merged into or added to the general reviewer prompt
        (assets/review-prompt.md), so both apply to the review. Saying that this happens when the
        prompt is assembled or when the fresh agent runs is sufficient; the response does not
        have to quote the rules or describe precedence. Failures: ignoring the project skill;
        replacing the general reviewer prompt with the project rules alone; searching the
        repository for a rules file instead of using the loaded skill. Nothing has to be executed
        here.

- description: "Only the area rule files the diff reaches join the project rules"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: ""
    user_message: >-
      Review changeset 4207. A loaded skill named code-review-rules holds this project's review
      rules. Its body has one general rule, "Public API changes need a changelog entry", and an
      Area rules section with two lines: "references/server.md — when the diff touches Server/"
      and "references/editor-ui.md — when the diff touches Editor/UI/". The cm diff rows for
      cs:4207 are:

      C /Server/Sync/Throttle.cs 1201 1302 game@myorg@cloud

      C /Server/Sync/Queue.cs 1188 1303 game@myorg@cloud

      Go through each area file and say whether it joins the reviewer's project rules and why;
      then, on the last line, list exactly what the Project rules input contains.
  assert:
    - type: llm-rubric
      value: >-
        One behavior is judged: the Project rules input for the reviewer must contain the
        code-review-rules body plus references/server.md, and must NOT contain
        references/editor-ui.md, because both changed files are under Server/ and none under
        Editor/UI/. Including editor-ui.md, leaving server.md out, or asking the reviewer agent to
        fetch the area files itself is a failure. Nothing has to be executed here.

- description: "Findings publish as Change requests; only a [Q] item publishes as a Question"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    # The items keep the report's section headings, as the user would paste them: a bare [N1]
    # does not say it is a finding, and the reference's "`Comment` is a plain note" then read as
    # the type for a small remark.
    user_message: |-
      Publish these two items from your report on merge request 311, exactly as written:

      ## ⚪ NITS (1)

      ### [N1] `retryCount` is spelled `retyCount` in the log message

      **`/src/Net/ProfileClient.cs`** line 61

      **Fix** — correct the spelling.

      ## ❓ QUESTIONS (1)

      ### [Q1] Is the 30-second timeout on `FetchProfile` intentional?

      **`/src/Net/ProfileClient.cs`** line 58

      The previous value was 5 seconds.
  assert:
    # [N1] is inline at line 61 as a Change request: --type=Change, or no --type (the default).
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm (mr|mergerequest|cr|codereview) comment add 311 (?!.*--type=(Comment|Question))(?=.*--path=[''"]?/src/Net/ProfileClient\.cs)(?=.*--line=61)' }
    # [Q1] is inline at line 58 as a Question.
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm (mr|mergerequest|cr|codereview) comment add 311 (?=.*--path=[''"]?/src/Net/ProfileClient\.cs)(?=.*--line=58)(?=.*--type=Question)' }

- description: "A finding in a file outside the diff is never anchored to that file"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Publish this finding on merge request 311, which I already approved. `cm diff
      br:/main/task009 --format="{status} {path} {baserevid} {revid} {repository}"` printed
      exactly one row:

      C /src/Inventory.cs 101 118 game@cloud

      [I1] `Inventory.Add(Item item)` became `Inventory.Add(Item item, int count)` at
      /src/Inventory.cs line 42, but /src/Shop.cs line 77 still calls `inventory.Add(item)` and no
      longer compiles. Fix: pass the count at that call.
  assert:
    - type: icontains
      value: "comment add 311"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '--path=\S*Shop\.cs' }
    - type: llm-rubric
      value: >-
        /src/Shop.cs is not in the diff, so no inline comment may be anchored to it. Anchoring the
        comment to /src/Inventory.cs (line 42 is the natural line) or posting it as a conversation
        comment with no --path are both correct, as long as the comment text still names
        /src/Shop.cs line 77. Anchoring it to /src/Shop.cs is a failure.

- description: "Existing project review rules govern the judgement, the skill only carries it into UVCS"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Review branch /main/task009 and publish the findings on its merge request. Our team already
      has a review checklist and a severity scheme we use everywhere — use ours, not yours.
  assert:
    - type: llm-rubric
      value: >-
        The response must defer to the team's existing review rules and severity scheme for the
        judgement, while still using cm for the UVCS mechanics (reading the diff, creating or
        locating the merge request, anchoring inline comments, setting reviewer status). Insisting
        on its own severity taxonomy or review format over the team's is a failure.

- description: "A published comment carries the finding body, not the report's chat structure"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Publish this one finding on merge request 311, exactly as I approved it in your report.
      Show me the full text you write to the comment file, then the command:

      ## 🔴 BLOCKERS (1)

      ### [B1] Air jumps play the jump clip twice

      **`/src/PlayerController.cs`** line 106

      The air-jump branch calls PlayOneShot, and PlayerJumped plays the same clip a frame later.

      **Fix** — delete line 106; PlayerJumped already handles the audio.
  assert:
    - type: icontains
      value: "--path=/src/PlayerController.cs"
    - type: icontains
      value: "--line=106"
    - type: llm-rubric
      value: >-
        The comment written to the file must start with "[B1] Air jumps play the jump clip twice"
        as its first line, then state what is wrong and the fix. Carrying the report's chat
        structure into the comment is a failure: no "BLOCKERS" section heading, no "###" in front
        of the title, and no line giving the location (`/src/PlayerController.cs` line 106) —
        the fix's own "delete line 106" is fine. Saying that those are dropped is fine and not a
        failure. Rewording or summarizing the finding is also a failure, since the user approved
        this exact text.

- description: "A published comment keeps the report's markdown"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |-
      Publish this one finding on merge request 311, exactly as I approved it in your report.
      Show me the full text you write to the comment file, then the command:

      ## ⚪ NITS (1)

      ### [N1] A concurrent apply is reported as a permission problem

      **`/src/Review/CheckChangeRequest.cs`** line 65

      `EnsureAppliedInChangeset` throws `CHANGE_REQUEST_NOT_APPLIED` whenever the read-back
      value differs, so a change request applied in **another** changeset tells the user to
      check their permissions.

      **Fix** — throw `CHANGE_REQUEST_ALREADY_APPLIED` before the last throw:

      ```csharp
      if (readBack.AppliedInChangesetId != NOT_APPLIED)
          throw new CmClientException("CHANGE_REQUEST_ALREADY_APPLIED", guid);
      ```
  assert:
    - type: icontains
      value: "--line=65"
    - type: llm-rubric
      value: >-
        One behavior is judged: the text written to the comment file must keep the finding's
        markdown — `EnsureAppliedInChangeset` and the constants still in backticks, and the code
        still inside a ```csharp fenced block. Stripping the backticks, turning the code into
        indented or plain text, or dropping the fix is a failure. Whether the title line or the
        location line is kept is not judged. Nothing has to be executed here.

- description: "Approving a merge request is not merging it"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      I reviewed merge request 311 and it looks good. Mark it approved and get it into /main.
      The uvcs-merge skill is installed too.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm (mr|mergerequest|cr|codereview) review 311 .*--reviewed' }
    # The merge is uvcs-merge's: a preview is fine, a merge that lands (--merge, --to) is not.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm merge .*(--merge|--to)' }

- description: "The author opening a merge request assigns the reviewer and reviews nothing"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Done with my branch, send it to jsmith for review — into /main, title "Add jump
      buffering"; that is all confirmed, do not ask again. Everything is checked in:
      `cm status --header` prints "/main/task042@game@localhost:8087" and nothing else, and
      `cm find mergerequest "where target='br:/main/task042'" --nototal` printed nothing.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm (mr|mergerequest) (create|mk) .*task042.*--users=\S*jsmith' }
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm (patch|diff|cat)\b|^cm (mr|mergerequest) (comment|review)\b' }

- description: "An author's pending changes are not in the merge request"
  vars:
    skill_content: file://../skills/uvcs-code-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Done with my branch, send it to jsmith for review — into /main, title "Add jump
      buffering". `cm status --header` prints:

      /main/task042@game@localhost:8087

      Changed

      Status    Size       Last Modified    Path

      Changed   2.31 KB    5 minutes ago    Assets/Scripts/PlayerJump.cs

      `cm find mergerequest "where target='br:/main/task042'" --nototal` printed nothing.
  assert:
    - type: llm-rubric
      value: >-
        The workspace has a pending change to PlayerJump.cs that is not checked in, so it would
        not be part of the merge request. The response must point that out and have it checked in
        before the merge request is created (asking the user to check it in, or a cm checkin step
        before the create). Creating the merge request without mentioning the pending change is a
        failure. Whether it also asks to confirm the title or reviewer is not judged.
