# uvcs-switch: the decision, not cm syntax. Pending changes are never disposed of silently,
# the two options are put to the user, the shelve precedes the undo, and the shelve is the last
# thing deleted. reference_content carries the hub reference the skill points at.

- description: "Pending changes stop the switch and produce the two options, not a bare cm switch"
  vars:
    skill_content: file://../skills/uvcs-switch/SKILL.md
    user_message: |
      Switch me to /main/task002. I already ran both status commands for you:

      cm status --header
      /main/task001@mygame@myorg@cloud (cs:4207 - head)

      cm status --machinereadable --all --fieldseparator="|"
      STATUS|4207|mygame|myorg@cloud
      CH|/wk/src/Player.cs|False|1072|NO_MERGES
      CH|/wk/src/Enemy.cs|False|1073|NO_MERGES
      CH|/wk/src/Inventory.cs|False|1074|NO_MERGES
      AD|/wk/src/Loot.cs|False|-1|NO_MERGES
  assert:
    - type: llm-rubric
      value: >-
        The workspace is dirty, so the response must stop and ask the user how to handle the
        pending changes, offering both leaving them behind on a shelve on /main/task001 and
        bringing them to /main/task002. Running cm switch now, or picking one of the two
        options on the user's behalf, is a failure. Naming the commands it would run after the
        answer is fine; re-running cm status or asking for its output is not required.

- description: "Leaving the changes behind shelves before it undoes, and marks the shelve the way the GUI does"
  vars:
    skill_content: file://../skills/uvcs-switch/SKILL.md
    reference_content: file://../skills/uvcs-core/references/branches-and-merge.md
    user_message: |
      I'm on /main/task001 and I want to go to /main. Leave my changes behind on a shelve, the
      way the Plastic GUI does — I have already decided, do not ask me again. I already ran both
      status commands for you:

      cm status --header
      /main/task001@mygame@myorg@cloud (cs:4207 - head)

      cm status --machinereadable --all --fieldseparator="|"
      STATUS|4207|mygame|myorg@cloud
      CH|/wk/src/Player.cs|False|1072|NO_MERGES
      CH|/wk/src/Enemy.cs|False|1073|NO_MERGES

      Give me every command to run, in order, through to the end.
  assert:
    - type: icontains
      value: "cm shelveset create"
    - type: icontains
      value: "--all"
    - type: icontains
      value: "Automatic shelve created during switch operation"
    - type: llm-rubric
      value: >-
        The commands must run in this order: create the shelve, then cm undo, then cm switch.
        Undoing or switching before the shelve exists is a failure, and so is omitting the undo
        (the workspace must be empty before the switch). The shelve comment must reference the
        branch being left by its id, in the form "(from br:<id>)".

- description: "Bringing the changes replays the shelve as a merge and keeps it until the merge is verified"
  vars:
    skill_content: file://../skills/uvcs-switch/SKILL.md
    reference_content: file://../skills/uvcs-core/references/branches-and-merge.md
    user_message: |
      Take me over to /main/task002 and bring my pending changes with me — I have already
      decided, do not ask me again. I already ran both status commands for you:

      cm status --header
      /main/task001@mygame@myorg@cloud (cs:4207 - head)

      cm status --machinereadable --all --fieldseparator="|"
      STATUS|4207|mygame|myorg@cloud
      CH|/wk/src/Player.cs|False|1072|NO_MERGES
      CH|/wk/src/Enemy.cs|False|1073|NO_MERGES

      List every cm command from the shelve to the replay on /main/task002, including the ones
      that run after the switch.
  assert:
    - type: icontains
      value: "cm merge sh:"
    - type: llm-rubric
      value: >-
        After the switch the response must replay the shelve with cm merge from the shelve spec,
        previewing it before applying. Using cm shelveset apply as the way to bring the changes
        across is a failure. If it deletes the shelve at all, that must be the final step and
        conditioned on the merge being finished with nothing left to resolve; deleting it before
        or regardless of the merge result is a failure. Naming the commands is enough — nothing
        is executed here.

- description: "A clean workspace just switches, with no shelve ceremony"
  vars:
    skill_content: file://../skills/uvcs-switch/SKILL.md
    user_message: >-
      cm status is clean and cm status --header shows /main@mygame@myorg@cloud (cs:4207 - head).
      Switch me to /main/task009.
  assert:
    - type: icontains
      value: "cm switch"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm undo' }
    - type: llm-rubric
      value: >-
        The workspace is clean, so the response must simply switch. Creating a shelve, undoing,
        or asking the user how to handle pending changes that do not exist is a failure.

- description: "The workspace is never switched blind on unknown status"
  vars:
    skill_content: file://../skills/uvcs-switch/SKILL.md
    reference_content: file://../skills/uvcs-core/references/branches-and-merge.md
    user_message: "Put my workspace on br:/main/release2 please."
  assert:
    - type: icontains
      value: "cm status"
    - type: llm-rubric
      value: >-
        Nothing is known about the workspace, so the response must check cm status before
        switching. Issuing cm switch as the first and only command is a failure. Explaining that
        a switch on a dirty workspace can be silently cancelled, fail, or carry the changes over
        is not required, but treating a zero exit code from cm switch as proof it happened is a
        failure.
