# uvcs-report-issue: a plugin defect is filed on the plugin's tracker, redacted, and only after
# the user has read the text; a UVCS product problem is not filed there at all. The last test
# loads the hub alone: the proactive offer has to work with nothing else loaded.

- description: "Filing a plugin issue waits until the user has read the text"
  vars:
    skill_content: file://../skills/uvcs-report-issue/SKILL.md
    reference_content: file://../skills/uvcs-report-issue/assets/issue-template.md
    user_message: |
      Report this as a plugin bug. I asked "which shelves did I create this week". The agent,
      following uvcs-core, ran:

      cm find shelve "where owner='me' and date >= 'this week'" --format="{shelveid} {comment}" --nototal --order-by=date

      and cm said: Unexpected option --order-by. I checked cm help find myself: there is no
      such flag, the sort goes inside the query string. macOS 15 / zsh, Claude Code. List every
      command from here up to and including the filing, in order, and mark the point where you
      stop for my approval.
  assert:
    - type: llm-rubric
      value: >-
        Before gh issue create there must be a stopping point where the complete report is
        shown to the user and filing waits for their approval. Listing gh issue create with no
        such stopping point, or presenting it as already run, is a failure. The label must be
        "bug" if one is named. The draft's wording, the evidence commands and the duplicate
        search are not judged.

- description: "The What-happened section of a report carries placeholders, not the real names"
  vars:
    skill_content: file://../skills/uvcs-report-issue/SKILL.md
    user_message: |
      Write only the "What happened" section of the plugin issue for me, redacted the way the
      skill says — the fenced block with the command and its output, nothing else, and do not
      tell me what you replaced. The agent ran:

      cm find shelve "where owner='jane.doe@acmegames.com' and date >= 'this week'" --format="{shelveid} {comment}" --nototal --order-by=date

      on repository projectfalcon@acmegames@cloud, and cm answered:

      Unexpected option --order-by
  assert:
    - type: not-icontains
      value: "acmegames"
    - type: not-icontains
      value: "jane.doe"
    - type: not-icontains
      value: "projectfalcon"
    - type: icontains
      value: "Unexpected option --order-by"
    - type: icontains
      value: "--order-by=date"

- description: "A plugin bug report collects the cm version"
  vars:
    skill_content: file://../skills/uvcs-report-issue/SKILL.md
    user_message: |
      Report this as a plugin bug. The agent, following uvcs-core, ran:

      cm find shelve "where owner='me'" --format="{shelveid} {comment}" --nototal --order-by=date

      and cm said: Unexpected option --order-by. I checked cm help find myself: there is no such
      flag. macOS 15 / zsh, Claude Code. Which commands do you run to collect the evidence for
      the report? Only those — do not draft or file anything yet.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm version' }
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'gh issue create' }

- description: "An approved report is filed with gh on the plugin repository, labelled bug"
  vars:
    skill_content: file://../skills/uvcs-report-issue/SKILL.md
    user_message: |
      This is the complete report you drafted, saved at /tmp/uvcs-issue.md. I read all of it:

      Title: [uvcs-core] find-queries.md gives cm find an --order-by flag cm rejects
      Label: bug

      ### Which skill

      `uvcs-core` — `skills/uvcs-core/references/find-queries.md`

      ### What the agent did

      ```
      cm find shelve "where owner='me'" --format="{shelveid} {comment}" --nototal --order-by=date
      Unexpected option --order-by
      ```

      ### What should have happened

      `cm help find` lists no --order-by flag, so the recipe should not use one.

      Yes: file it as written, and do not ask me again. List every command from here to the
      issue URL.
  assert:
    - type: icontains
      value: "gh issue create"
    - type: icontains
      value: "--repo Unity-Technologies/uvcs-agent-plugin"
    - type: icontains
      value: "--label bug"
    - type: icontains
      value: "--body-file"
    - type: llm-rubric
      value: >-
        The user has approved the text, so the response must proceed to file the issue with gh
        issue create on the plugin repository, using the saved body file. Stopping to ask for
        approval again — a question, or a wait before gh issue create — is a failure. Not a
        failure: wording that mentions the approval ("based on your approval"), or saying the
        commands are only planned here, since the exercise executes nothing. Any label other than bug is a failure. Checking gh authentication and
        searching for an existing issue first are correct, not required. Naming the commands is
        enough: nothing is executed here, so no issue URL can appear.

- description: "An unreachable server is a UVCS problem, not a plugin issue"
  vars:
    skill_content: file://../skills/uvcs-report-issue/SKILL.md
    user_message: |
      Report this bug in the plugin: every command fails. cm status --header says
      "The server myorg@cloud could not be reached. Check the network connection." and cm find
      branch "where owner='me'" says the same thing.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^gh issue create' }
    - type: llm-rubric
      value: >-
        One behavior is judged: the failure is a UVCS server or connection problem, not a defect
        in the plugin, so the response must not file or draft a plugin issue for it. Filing one,
        or treating it as a plugin defect, is a failure. Where it sends the user instead is not
        judged, and mentioning gh issue create while explaining why it does not apply is fine.

- description: "A missing workflow is requested as an enhancement, not a bug"
  vars:
    skill_content: file://../skills/uvcs-report-issue/SKILL.md
    user_message: |
      There is no skill for summarizing everything merged into /main since a label, and I do it
      by hand every release with cm find changeset and cm log. Request it as a plugin issue. You
      already wrote the draft to /tmp/uvcs-request.md earlier in this session, titled
      "[uvcs-core] No workflow for summarizing merges since a label"; I have read all of it and
      approve it as is. Give me the command that files it.
  assert:
    - type: icontains
      value: "gh issue create"
    - type: icontains
      value: "--label enhancement"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '--label bug' }

- description: "The hub alone turns a rejected recipe into a corrected command and an offer to report"
  vars:
    user_message: |
      You gave me this from uvcs-core/references/history-and-annotate.md and I ran it:

      cm log cs:4207 --nototal

      cm answered: Unexpected option --nototal. I ran cm help log: there is no --nototal on log.
      What now?
  assert:
    - type: icontains
      value: "uvcs-report-issue"
    - type: regex
      value: "cm log cs:4207(?![^\\n]*--nototal)"
    - type: llm-rubric
      value: >-
        The response must include offering the user to report the faulty recipe with the
        uvcs-report-issue skill — asked directly, or stated as the step it takes once the task is
        done; this is a planning answer, so either form is the offer. Leaving the offer out,
        sending the user to Unity product support, retrying with other guessed flags, or filing
        an issue without asking are failures. How the error is explained is not judged.
