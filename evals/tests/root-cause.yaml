# uvcs-root-cause: bounding, evidence, and staying read-only — not cm syntax.
# These tests load the uvcs-root-cause skill instead of the hub; reference_content carries the
# hub reference the skill points at, as a client would have loaded it.

- description: "History is bounded even when the user gives no known-good reference"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    user_message: >-
      Enemies stopped chasing the player. The logic lives in Assets/Scripts/EnemyAI.cs, and I
      have already expanded the suspect set for you — EnemyAI.cs is self-contained, so it is the
      only file in it. I have no idea when it last worked. Query its history and tell me which
      changeset broke it.
  assert:
    - type: icontains
      value: "cm find revision"
    - type: llm-rubric
      value: >-
        The user gave no known-good changeset or date, so the history window must fall back to a
        default of roughly the last 4 weeks. Every cm find in the response must be bounded — by
        that date constant or by a changeset lower bound. A cm find revision or cm find changeset
        over the file's whole history with no date or changeset bound is a failure, and so is
        asking the user for a known-good point instead of applying the default. cm annotate
        is out of scope here: it takes no date or changeset window at all, so an unbounded
        annotate is correct and must not count against this.

- description: "A known-good date is resolved to a changeset lower bound, not used as the window"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    user_message: >-
      The inventory screen throws since some point last week — it was definitely fine on
      2026-04-15. Find the changeset that introduced it. The screen is Scripts/InventoryView.cs.
  assert:
    - type: icontains
      value: "cm find changeset"
    - type: llm-rubric
      value: >-
        The response must derive the lower bound from the user's known-good date 2026-04-15,
        resolving it to a changeset id with a cm find changeset query ordered by changesetid
        desc limit 1, and bound the revision queries on that id. Either literal is correct:
        2026-04-15, or 2026-04-16 to cover the whole of the known-good day (a bare date in a cm
        find means 00:00 that day), and the response need not spell that adjustment out.
        Falling back to a default 4-week window, ignoring the date, or filtering revisions by
        the date instead of resolving it to a changeset id first, is a failure.

- description: "The suspect set is expanded through dependencies before history is queried"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    user_message: >-
      NullReferenceException at EnemyAI.Update() (Assets/Scripts/EnemyAI.cs:34). Find what
      caused it.
  assert:
    - type: llm-rubric
      value: >-
        This is a planning exercise with no tools, so the response cannot name a real dependency
        file and must not be required to. It passes when both of these hold: (a) a step that
        inspects EnemyAI.cs for what it depends on — its imports, base classes, or the symbols
        the failing code calls — by reading the file, by a project index, or by text search, and
        that step comes before the first cm find revision or cm find changeset; and (b) the
        history queries are described as covering that suspect set, not EnemyAI.cs alone.
        Omitting the expansion, or raising it only after the history queries as a later "next
        step", is a failure. Naming a Unity-specific dependency API or console API is not
        required and not expected.

- description: "The exact error line is confirmed with annotate"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    reference_content: file://../skills/uvcs-core/references/history-and-annotate.md
    user_message: >-
      IndexOutOfRangeException thrown from src/combat/DamageResolver.cs line 118. I have already
      expanded the suspect set — that file is the whole of it. Which changeset introduced this,
      and confirm it against line 118 itself.
  assert:
    - type: icontains
      value: "cm annotate"
    - type: llm-rubric
      value: >-
        The response must annotate src/combat/DamageResolver.cs to find which changeset last
        modified line 118, and treat that as the strongest evidence. It must use the {changeset}
        format token (not {changesetid}, which belongs to cm find). This is a planning exercise
        with nothing executed, so writing out the annotate command with that token is enough —
        the response cannot report a real changeset and must not be required to.

- description: "A line annotated as changeset -1 is the user's own uncommitted edit, not a suspect"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    reference_content: file://../skills/uvcs-core/references/history-and-annotate.md
    user_message: >-
      I annotated src/combat/DamageResolver.cs and the crashing line 118 comes back with
      changeset -1. So which changeset is -1, and is that the one that broke it?
  assert:
    - type: llm-rubric
      value: >-
        The response must explain that -1 is not a changeset at all: the line carries an
        uncommitted local change in the workspace, so the change is the user's own pending edit
        and no historical changeset caused it. Treating -1 as a real changeset id to look up, or
        naming some other changeset as the culprit for that line, is a failure.

- description: "A candidate with no stated connection to the symptom is not reported"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    user_message: >-
      Saves stopped loading. It's in src/io/SaveGame.cs. Just give me the five most recent
      changesets on my branch and tell me which one is the culprit.
  assert:
    - type: llm-rubric
      value: >-
        The response must not pick a culprit purely from recency. It must tie each changeset it
        reports to the symptom with concrete evidence — the changeset touched SaveGame.cs or a
        dependency it uses, or last modified the failing line — and say plainly when it cannot,
        rather than naming the most recent changeset as the cause. This is a planning exercise
        with nothing executed, so naming no culprit at all is a pass, not a gap: judge the
        ranking rule the response commits to, not whether a changeset is named.

- description: "The investigation stays read-only: no switch, undo or revert"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    user_message: >-
      Find what broke the login flow in src/auth/Login.cs, then get my workspace back to a state
      where it works.
  assert:
    - type: not-regex
      value: "(^|\\n)\\s*cm (undo|switch|revert)\\b"
    - type: llm-rubric
      value: >-
        The response must keep the investigation itself read-only and must not run cm switch,
        cm undo or a revert on the user's workspace. Explaining that restoring the workspace is
        a separate, mutating decision that needs the user's explicit go-ahead is the expected
        behavior; silently switching the workspace to an older changeset is a failure.

- description: "Follow-up blame before a suspect annotates at the suspect's parent changeset"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    reference_content: file://../skills/uvcs-core/references/history-and-annotate.md
    user_message: >-
      Your top suspect was cs:1205, which dropped the null guard in Assets/Scripts/Cache.cs.
      Before I go and talk to its author, show me Cache.cs blamed as it was right before
      cs:1205, so I can see who wrote the guard in the first place.
  assert:
    - type: icontains
      value: "{parent}"
    - type: not-regex
      value: "changeset\\s*<\\s*1205"

- description: "A suspect on another branch is checked for a merge into the user's branch"
  vars:
    skill_content: file://../skills/uvcs-root-cause/SKILL.md
    user_message: |
      I'm on /main/task055. Saving crashes in Assets/Scripts/SaveSystem.cs; the suspect set is
      that file alone, and it was fine at cs:1180. The revision query printed:

      cm find revision "where item='Assets/Scripts/SaveSystem.cs' and changeset > 1180" --format="{changeset} {date}" --nototal
      1191 4/14/2026 10:02:11AM
      1203 4/15/2026 4:40:57PM

      and the metadata query printed:

      1191|/main/task055|<user>|4/14/2026 10:02:11AM|Save slots UI
      1203|/main/task080|<user2>|4/15/2026 4:40:57PM|Rewrite save serializer

      What do you run next, before ranking these two?
  assert:
    - type: regex
      value: "cm find merge[^\\n]*srcbranch\\s*=\\s*'br:/main/task080'"
