# uvcs-address-review: the author side. Anchoring to the workspace branch, deriving "pending"
# from the thread, the location+1 rule, one comment per changeset, and the two modes' endings.
# reference_content carries the hub reference the skill points at, as a client would have loaded it.

- description: "Pending changes block the workflow before anything is read"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    user_message: >-
      Fix the review comments on this branch. For context: cm status --header prints
      /main/task001@mygame@myorg@cloud (cs:4207 - head), and cm status lists 3 changed files in
      the workspace.
  assert:
    - type: llm-rubric
      value: >-
        The workspace has pending changes, so the response must stop and ask the user to check
        them in or shelve them (cm shelveset create) before addressing review comments. Actually
        proceeding — loading the review's comments, editing files, or working the queue — is a
        failure. Outlining what will happen *after* the workspace is clean is not a failure, as
        long as the stop is unambiguous and nothing is presented as already done.

- description: "A label selector stops the workflow instead of searching elsewhere"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    user_message: >-
      Address the review comments. cm status --header shows the workspace is on label
      lb:v2.1-release, and cm status is clean. List only the commands you run up to the point
      where you stop, not the ones that would come after.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm find changereviewcomment' }
    - type: icontains
      value: "v2.1-release"
    - type: llm-rubric
      value: >-
        Applying review fixes needs the workspace on the reviewed branch. The response must stop,
        name the label the workspace is on, and let the user switch. Searching other branches for
        a review, or running cm switch itself, is a failure.

- description: "A branch the user names that is not the workspace's needs confirmation, not a switch"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    user_message: >-
      Fix the review on /main/feature-x. cm status --header shows the workspace is on
      /main/feature-y and cm status is clean.
  assert:
    - type: llm-rubric
      value: >-
        The response must ask the user before switching the workspace, because cm switch replaces
        their working tree. Running cm switch straight away is a failure, and so is silently
        addressing the review on /main/feature-y instead of the branch the user named.

- description: "The review lookup queries review by target, not mergerequest and not by status"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Address the review comments on the current branch. The workspace is clean and on
      /main/task001. What do you run to locate the review?
  assert:
    - type: icontains
      value: "cm find review"
    - type: icontains
      value: "target='br:/main/task001'"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm find mergerequest' }
    - type: llm-rubric
      value: >-
        The lookup must be cm find review filtered on target, because a branch can carry a plain
        code review rather than a merge request and the author has to address either. Filtering
        the query on a review status such as 'Rework required' is a failure — whether a comment is
        pending is a property of the comment, not of the review's status field.

- description: "location is 0-based: the line to edit is location + 1"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/find-queries.md
    user_message: >-
      Review 311 has one pending change request: type=change, parent=-1,
      appliedinchangeset=-1, location=88, revisionid=5501234,
      guid=8123d65a-620d-49ee-bf51-f526741a3341. Which line of the file does this comment point
      at, and how do you find out which file it is?
  assert:
    - type: icontains
      value: "89"
    - type: icontains
      value: "cm find revision"
    - type: icontains
      value: "5501234"
    - type: llm-rubric
      value: >-
        The comment's location is 0-based, so the editor line is 89, not 88. Answering 88, or
        subtracting instead of adding, is a failure. The file must be resolved by feeding
        revisionid 5501234 to cm find revision; searching the filesystem, grepping for a
        filename, or guessing a path from the comment text is a failure.

- description: "A change with a discarded child is not pending, and neither is an applied one"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |
      Review 311's thread (cm find changereviewcomment --xml), replies indented under the
      comment their parent field points at:
      - id=900 type=change parent=-1 appliedinchangeset=-1 location=88
      - id=901 type=change parent=-1 appliedinchangeset=4210 location=120
      - id=902 type=change parent=-1 appliedinchangeset=-1 location=140
          - id=903 type=discarded parent=902 location=140
      - id=907 type=timeline parent=-1 location=-1
      Go through the top-level ids in order and say for each whether it is pending and why;
      then, on the last line, list the ids that go in the work queue. Do not run anything.
  assert:
    - type: llm-rubric
      value: >-
        The final work queue must contain exactly one item: the change id=900. 901 is already
        applied (appliedinchangeset 4210); 902 was discarded by its child 903, so it is settled
        even though its own fields still read type=change and appliedinchangeset=-1; 903 is a
        child and 907 is a timeline entry. A final queue that includes 901, 902, 903 or 907, or
        treating -1 as a real changeset or comment id, is a failure. Judge the final queue line,
        not the reasoning steps before it.

- description: "A question with a reply is answered, a question without one is pending"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |
      Review 311's thread (cm find changereviewcomment --xml) has two top-level questions from
      the reviewer, 904 and 906, plus a timeline entry 907. Question 904 has one reply, 905
      (type=comment, parent=904), posted by me last week. Question 906 has no reply.
      Say for each of 904 and 906 whether it is still pending and why; then, on the last line,
      list the ids that go in the work queue. Do not run anything.
  assert:
    - type: llm-rubric
      value: >-
        The final work queue must contain exactly one item: the question id=906, which has no
        reply. 904 was answered by its child 905 (a reply of type comment settles a question),
        so it is excluded; 905 is a child and 907 is a timeline entry. A final queue that
        includes 904, 905 or 907 is a failure. Judge the final queue line, not the reasoning
        steps before it.

- description: "Interactive mode checks in one comment per changeset with the apply-change tag"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Interactive mode, review 311. Two pending change requests, both in /src/Player.cs:
      B1 (guid 8123d65a-620d-49ee-bf51-f526741a3341) and S1 (guid
      a4e7f012-1234-5678-abcd-ef0123456789). I said "fix B1", you edited the file and I replied
      "ok". What do you run?
  assert:
    - type: icontains
      value: "apply-change:8123d65a"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'apply-change:a4e7f012' }
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm shelveset create' }
    - type: llm-rubric
      value: >-
        The response must run a cm checkin carrying the [apply-change:8123d65a] tag for B1 alone,
        with the file path named. Batching S1 into the same changeset, or including a second
        apply-change tag, is a failure: the two fixes are independent, so each gets its own
        changeset.

- description: "Two fixes that cannot build apart share one check-in with both apply-change tags"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Interactive mode, review 311. B1 (guid 8123d65a-620d-49ee-bf51-f526741a3341) asks to rename
      Inventory.Add to Inventory.TryAdd in /src/Inventory.cs; I2 (guid
      a4e7f012-1234-5678-abcd-ef0123456789) asks to handle the new bool result in
      /src/Player.cs, the only caller. Neither file compiles without the other. I have already
      decided: fix both now. You edited both files and I replied "ok". What do you run?
  assert:
    - type: icontains
      value: "apply-change:8123d65a"
    - type: icontains
      value: "apply-change:a4e7f012"
    - type: llm-rubric
      value: >-
        The response must run a single cm checkin naming both files whose comment carries both
        [apply-change:8123d65a] and [apply-change:a4e7f012]. Splitting the fix into two check-ins
        is a failure, because the first changeset would not compile. The wording is not judged.

- description: "A mistyped apply-change tag is linked with editcomment, not a second check-in"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Interactive mode, review 311. I approved the fix for B1 (guid
      8123d65a-620d-49ee-bf51-f526741a3341) and you ran:
      cm checkin src/Pool.cs -c "[apply-change:8123d56a] Return the item to the pool"
      It printed "Created changeset cs:4210@br:/main/task001@mygame@myorg@cloud", then "The
      following review change requests (specified in the checkin comment) cannot be found or are
      already applied in a previous changeset" and exited 1. I see the tag has a typo. What do you
      run now?
  assert:
    - type: icontains
      value: "editcomment"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm (checkin|ci) ' }
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: 'cm changeset editcomment cs:4210\S* .*\[apply-change:8123d65a\]' }

- description: "Unattended mode shelves each fix and undoes only the paths it edited"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Unattended mode, review 311. Two pending change requests: B1 in /src/Player.cs (guid
      8123d65a-620d-49ee-bf51-f526741a3341) and S1 in /src/ItemData.cs (guid
      a4e7f012-1234-5678-abcd-ef0123456789). Both fixes are clear and each touches only its own
      file. Give only the commands you run, in order. I land your work myself afterwards, so leave
      my commands out.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm shelveset create .*Player\.cs' }
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm shelveset create .*ItemData\.cs' }
    # One shelve per fix: a single shelve holding both files would pass the two checks above.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm shelveset create (?=.*Player\.cs)(?=.*ItemData\.cs)' }
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm undo .*Player\.cs' }
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm undo .*ItemData\.cs' }
    # Never a workspace-wide undo: `-r`, `.`, `--all`, or no path at all.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm undo(\s*$|.*\s(-r|--all|\.)(\s|$))' }
    # No check-in *command line*; telling the user to check the shelves in afterwards is fine.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm checkin' }
    - type: llm-rubric
      value: >-
        One behavior is judged: the order. Each fix's cm shelveset create is followed by the cm
        undo of its own path before the next fix is shelved, so each shelve holds only its own
        fix. Nothing else is judged.

- description: "Unattended wrap-up does not re-request the review"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Unattended mode on review 311 is finished: B1 shelved as sh:101, S1 shelved as sh:102, Q1
      answered. Write the wrap-up and give me the commands I run now.
  assert:
    - type: icontains
      value: "cm shelveset apply sh:101"
    # No re-request *command line*; saying "ask me to re-request afterwards" in prose is fine.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm (mr|mergerequest|cr|codereview) review 311 .*--re-request' }
    - type: llm-rubric
      value: >-
        Nothing has been checked in yet, so the response must not re-request the review now:
        running cm mr review 311 --re-request as one of its commands is a failure. It must tell
        the user to apply the shelves and check them in — reusing the shelve comment so the
        [apply-change:] tag fires at check-in — and to ask for the re-request afterwards.

- description: "A reply is posted against the comment GUID, and a question is never discarded"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Interactive mode, review 311. Q1 is a question, comment id 7700042, guid
      b5f8e123-9999-aaaa-bbbb-ccccddddeeee, on /src/Player.cs line 104. I said "answer Q1" and
      approved your draft. What do you run?
  assert:
    - type: icontains
      value: "comment reply"
    - type: icontains
      value: "b5f8e123-9999-aaaa-bbbb-ccccddddeeee"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '--discard' }
    - type: llm-rubric
      value: >-
        The reply must identify the parent comment by its GUID, not by the numeric id 7700042,
        which cm rejects. Suggesting --discard for a question the user asked to be answered is a
        failure.

- description: "A reviewer comment with no reply is pending, alongside changes and questions"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |
      Review 311's thread (cm find changereviewcomment --xml), all top-level (parent=-1), none of
      them has any reply, all posted by the reviewer:
      - id=910 type=comment location=41 "This loop allocates on every frame."
      - id=911 type=timeline location=-1
      Say for each of 910 and 911 whether it is pending and why; then, on the last line, list the
      ids that go in the work queue. Do not run anything.
  assert:
    - type: llm-rubric
      value: >-
        The final work queue must contain exactly one item: id=910, a reviewer comment with no
        reply, which still has to be addressed, clarified or answered. 911 is a timeline entry and
        is excluded. A final queue that is empty, or that includes 911, is a failure. Judge the
        final queue line, not the reasoning steps before it.

- description: "The plan orders narrow changes before broad ones, and questions last"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    user_message: |
      Review 311 has three pending items, all clear, all in the order the thread lists them:
      - Q1 (question) /src/Player.cs line 30: "Why is the cache static?"
      - CH1 (change) /src/Player.cs line 12, /src/Enemy.cs line 40, /src/Npc.cs line 8:
        "Move the three copies of the health clamp into one shared HealthUtils.Clamp."
      - CH2 (change) /src/Inventory.cs line 57: "Rename tmp to remainingSlots."
      None of them depends on another: no request touches code another item creates or moves.
      For each item, say how narrow or broad the change is; then, on the last line, give the
      order you will work them in. Do not run anything yet.
  assert:
    - type: llm-rubric
      value: >-
        The order on the last line must be CH2 (a one-line rename) first, CH1 (a refactor across
        three files) second and Q1 (a question) last. Any other order is a failure — in
        particular thread or file/line order, or Q1 before the changes. Judge the final order
        line, not the per-item reasoning before it.

- description: "A question that points at a real fix is fixed without the apply-change tag, then answered"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: >-
      Interactive mode, review 311. Q1 is a question, guid b5f8e123-9999-aaaa-bbbb-ccccddddeeee, on
      /src/Player.cs line 104: "Shouldn't this dispose the stream?" It should — you already
      edited src/Player.cs to wrap the stream in a using block, showed me the diff and I said
      "ok, check it in and answer". Nothing is checked in yet; the check-in you run will create
      cs:4230. Give every command, in order, starting with the check-in.
  assert:
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'apply-change:b5f8e123' }
    - type: javascript
      value: file://assertions/commands.cjs:runs
      config: { pattern: '^cm (checkin|ci)\b' }
    - type: icontains
      value: "comment reply"
    - type: llm-rubric
      value: >-
        The response must check in the fix with a plain comment (no [apply-change:] tag, which
        matches only change requests and errors on a question), and then reply to Q1 by its GUID
        saying it is fixed in cs:4230. Tagging the check-in with apply-change, discarding the
        question, or replying before the check-in is a failure.

- description: "A change request the reviewer got wrong is proposed for discard, not discarded"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |
      Interactive mode, review 311. CH1 (change, guid 7c3d9e01-1111-2222-3333-444455556666) on
      /src/Inventory.cs line 22 says: "Throw ArgumentNullException here when slot is null." Its
      revision is on the branch head changeset and nothing has touched the file since. This is
      the code there:

          public void Add(Slot slot) {
              ArgumentNullException.ThrowIfNull(slot);
              slots.Add(slot);

      I said "look at CH1". What do you tell me, and what would you run if I agree with you?
  assert:
    - type: icontains
      value: "--discard"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm checkin' }
    - type: llm-rubric
      value: >-
        The null check is already there (ArgumentNullException.ThrowIfNull on the line above),
        so the change request is wrong. The response must say so, propose discarding CH1 with
        that reason, and leave the decision to the user — the discard reply is what it would run
        once the user agrees. Making a code change, checking anything in, or presenting the
        discard as already posted is a failure.

- description: "A comment anchored before a later changeset is applied where the code now is"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/find-queries.md
    user_message: |
      Interactive mode, review 311. CH1 (change, guid 5c2e9b71-0a4d-4f3e-9b8a-1d2c3e4f5a6b,
      location=39) says "Guard against a zero divisor in the average." cm find revision on its
      revisionid printed:
      src/Stats.cs|4201|/main/task001
      The branch head is cs:4212, and cs:4205 added a header block to src/Stats.cs. I already
      read the revision the reviewer saw with cm cat: its line 40 was `return total / count;`. In
      the workspace copy line 40 is now `// Licensed under Apache-2.0`, and `return total /
      count;` is on line 58 — the only division in the file. I said "fix CH1". Which line do you
      change, what does it become, and which check-in do you run once I approve the diff?
  assert:
    - type: icontains
      value: "58"
    - type: llm-rubric
      value: >-
        The comment was anchored at cs:4201 and cs:4205 later shifted the file, so line 40 no
        longer holds the code the reviewer meant. The response must apply the zero-divisor guard
        to `return total / count;` on line 58, where that code now is. Editing line 40, or
        refusing because the line does not match, is a failure. Only the line chosen and the edit
        described are judged, not whether the edit is shown as already applied.

- description: "Interactive mode proposes the first planned fix and waits for the ok"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |
      Interactive mode, review 311. The plan you showed me, which I accepted:
      1. CH2 (change, guid 8123d65a-620d-49ee-bf51-f526741a3341) src/Player.cs line 57:
         "Rename tmp to remainingHealth." Line 57 reads `var tmp = health - damage;` and tmp is
         used again only on line 58: `health = Math.Max(0, tmp);`
      2. CH1 (change) src/Player.cs line 12, src/Enemy.cs line 40: "Share the health clamp."
      3. Q1 (question) src/Player.cs line 30: "Why is the cache static?"
      You already have src/Player.cs open; those two lines are all the rename touches. I said
      "start". What do you do now? Give any command you would run once I approve.
  assert:
    - type: llm-rubric
      value: >-
        The response must work on CH2 only: propose the rename as a diff of lines 57-58 and stop
        to ask the user for approval before checking anything in. Showing the cm checkin with
        the [apply-change:8123d65a] tag that it will run once approved is correct. Presenting
        the check-in as already done, or starting on CH1 or Q1, is a failure.

- description: "Interactive mode drafts a question's reply and waits before posting it"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |
      Interactive mode, review 311. Next in the plan is Q1 (question, guid
      b5f8e123-9999-aaaa-bbbb-ccccddddeeee) on src/Player.cs line 30: "Why is the cache static?"
      The code there:

          // Shared by every Player: the sprite atlas is loaded once per process.
          private static readonly SpriteCache cache = SpriteCache.Load("players");

      I said "answer Q1". What do you do now? Give any command you would run once I approve.
  assert:
    - type: llm-rubric
      value: >-
        The response must draft a reply (the atlas is loaded once and shared by every Player) and
        ask the user to approve or edit it before posting. Showing the cm mr comment reply
        command it will run once approved is correct. Presenting the reply as already posted,
        proposing a code change, or a discard, is a failure.

- description: "A suggestion anchored before a later changeset replaces the code where it now is"
  vars:
    skill_content: file://../skills/uvcs-address-review/SKILL.md
    reference_content: file://../skills/uvcs-core/references/reviews-and-merge-requests.md
    user_message: |-
      Interactive mode, review 311. CH1 (change, guid 8123d65a-620d-49ee-bf51-f526741a3341,
      location=60) on src/Net/ProfileClient.cs says:

      [I1] `retryDelay` is in seconds, not milliseconds

      ```suggestion
              await Task.Delay(TimeSpan.FromSeconds(retryDelay));
      ```

      cm find revision on its revisionid printed: src/Net/ProfileClient.cs|4201|/main/task001.
      The branch head is cs:4212, and cs:4205 added three using lines at the top of the file. In
      the revision the reviewer saw, line 61 was `        await Task.Delay(retryDelay);`. In the
      workspace copy line 61 is now `        var attempt = 0;`, and
      `        await Task.Delay(retryDelay);` is on line 64, the only Task.Delay in the file. I said
      "fix CH1". Which line do you change, what does it become, and which check-in do you run
      once I approve the diff?
  assert:
    - type: icontains
      value: "64"
    - type: llm-rubric
      value: >-
        One behavior is judged: the comment was anchored at cs:4201 and cs:4205 later shifted the
        file, so the fix must replace `await Task.Delay(retryDelay);` on line 64 with
        `await Task.Delay(TimeSpan.FromSeconds(retryDelay));`. Replacing line 61
        (`var attempt = 0;`), or refusing because line 61 does not match, is a failure. Whether
        the edit is shown as already applied, and the check-in wording, are not judged.
