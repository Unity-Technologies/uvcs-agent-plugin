# cm shell batching: it must fire on a many-command read-only workload, stay off for
# small or mutating ones, and carry the contract that changes when it is used.

- description: "Many read-only commands known up front: batches with cm shell"
  vars:
    user_message: >-
      I need the log and the diff for each of changesets 201 through 210 on this cloud repo.
      That is a lot of cm calls and it feels slow — what is the fastest way to run them?
    reference_content: file://../skills/uvcs-core/references/batching-commands.md
  assert:
    - type: icontains
      value: "cm shell"
    - type: icontains
      value: "--shelloutputfile"
    - type: llm-rubric
      value: >-
        The response batches the commands into a single cm shell invocation, with the
        command lines written WITHOUT the "cm " prefix (e.g. "log cs:201", not
        "cm log cs:201") and "exit" as the last line. It must not claim the batch's
        success can be read from the process exit code or $?.

- description: "A single command must not be batched"
  vars:
    user_message: "What branch is this workspace on right now?"
    reference_content: file://../skills/uvcs-core/references/batching-commands.md
  assert:
    - type: icontains
      value: "cm status"
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: 'cm shell' }

- description: "Below the 5-command threshold, stay with plain cm commands"
  vars:
    user_message: >-
      cm feels slow on this cloud repo. I need the comment of changeset 4207 and the comment
      of changeset 4210 — just those two. Is it worth batching them in cm shell, or should I
      run them plainly?
    reference_content: file://../skills/uvcs-core/references/batching-commands.md
  assert:
    # No cm shell *invocation* line; mentioning cm shell in prose to reject it is fine.
    - type: javascript
      value: file://assertions/commands.cjs:notRun
      config: { pattern: '^cm shell' }
    - type: llm-rubric
      value: >-
        The response runs the two changesets as ordinary separate cm commands. If it
        mentions cm shell at all, it must be to say batching is NOT worth it at this
        count (it loses below about five commands) — recommending a batch here is a
        failure.

- description: "Mutating commands are never batched"
  vars:
    user_message: >-
      I have ten files to check in, each with its own comment, and I want it fast.
      Can I run all ten cm checkin calls in one cm shell batch?
    reference_content: file://../skills/uvcs-core/references/batching-commands.md
  assert:
    - type: llm-rubric
      value: >-
        The response refuses to batch the check-ins in cm shell and says batching is for
        read-only commands only. Agreeing to batch cm checkin is a failure, even with
        caveats attached. The reason it gives is not judged.

- description: "Batch results are read from CommandResult, not the process exit code"
  vars:
    user_message: >-
      I ran twenty cm find queries in one cm shell batch and the process exited 0.
      Does that mean every query succeeded?
    reference_content: file://../skills/uvcs-core/references/batching-commands.md
  assert:
    - type: icontains
      value: "CommandResult"
    - type: llm-rubric
      value: >-
        The response says NO: the cm shell process exit code proves nothing about the
        queries inside it, and each query's own result (its CommandResult line, e.g. the
        final line of its --shelloutputfile) is what has to be checked. Treating exit 0
        as success, or checking only one result for the whole batch, is a failure. How
        the files are named or read is not judged.

- description: "Errors inside a batch go to stdout, not stderr"
  vars:
    user_message: >-
      In my cm shell batch I redirected stderr to a log file to catch failures, but the
      log is empty even though one command clearly failed. Why?
    reference_content: file://../skills/uvcs-core/references/batching-commands.md
  assert:
    - type: llm-rubric
      value: >-
        The response explains that cm shell writes error messages to stdout by default,
        so a stderr-only capture sees nothing. Mentioning --enablestderr as the flag that
        splits the streams, or pointing to the CommandResult line / per-command output
        file as where to detect the failure, both count as correct.
