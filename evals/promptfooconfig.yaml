# Eval suite for the UVCS plugin skills.
#
# Design goals (see evals/README.md):
# - FAST and CHEAP: one small evaluated model, one judge, one API call per test.
# - MODEL-AGNOSTIC: no test may depend on one model's phrasing. Commands are asserted on
#   the command lines (assertions/commands.cjs), never on prose; the gate in run-evals.sh
#   measures a pass rate instead of assuming one prompt always gets one answer. Moving to
#   another model family is the two `id:` lines below plus the parameters that family takes.
# - Green = the skill still teaches the behaviors that matter; red = something broke
#   (a renamed section, a deleted gotcha, a regressed instruction).

description: "UVCS plugin skill evals"

providers:
  # Evaluated model: the smallest current model on purpose — the skill must carry the
  # knowledge, not the model.
  - id: anthropic:messages:claude-haiku-5-5
    config:
      # Haiku 5.5 answers run about twice as long as Haiku 4.5's; at 1024 the longest
      # scenarios truncated before the command under test.
      max_tokens: 2048
      # Adaptive thinking would spend max_tokens before the answer, and the skill text, not
      # the model's deliberation, is what the suite measures.
      thinking:
        type: disabled
      # No `temperature`: Claude 5 models reject sampling parameters (promptfoo strips one
      # with a warning). Answers vary from run to run, which run-evals.sh is built for.
      # Auth also works via a WIF bearer token in ANTHROPIC_CUSTOM_HEADERS (CI);
      # locally, ANTHROPIC_API_KEY is picked up as usual.
      apiKeyRequired: false

defaultTest:
  options:
    # Judge for llm-rubric assertions only.
    provider:
      id: anthropic:messages:claude-sonnet-5-5
      config:
        # Thinking would come out of max_tokens, and a judge that hit the cap mid-verdict
        # was scored "Could not extract JSON from llm-rubric response" — a failure with no
        # defect behind it. Grading a fixed rubric is classification, not reasoning. Sonnet
        # 5.5 rejects `type: disabled` with a 400; `between_tools` is its no-thinking mode
        # for a call that uses no tools.
        thinking:
          type: between_tools
        max_tokens: 2048
        apiKeyRequired: false
        # No `temperature`, for the same reason as above; judge variance is absorbed by the
        # retry gate, not pinned.
  vars:
    # Default is the hub skill; workflow-skill tests override skill_content per test.
    skill_content: file://../skills/uvcs-core/SKILL.md
    reference_content: ""

prompts:
  - id: eval-prompt
    label: "Skill-loaded agent"
    raw: |
      You are an AI coding agent. The following skill is loaded; follow it exactly.

      {{skill_content}}

      {{reference_content}}

      This is a planning exercise: do not execute anything. Reply with the exact
      cm command(s) you would run (in fenced code blocks) plus at most three
      sentences of explanation. What the user reports — command output, earlier
      steps, what they decided or approved — is true; do not ask for it again.

      ## User request

      {{user_message}}

tests:
  - file://tests/queries.yaml
  - file://tests/commands.yaml
  - file://tests/reporting.yaml
  - file://tests/merge.yaml
  - file://tests/switch.yaml
  - file://tests/reviews.yaml
  - file://tests/workspaces.yaml
  - file://tests/root-cause.yaml
  - file://tests/code-review.yaml
  - file://tests/address-review.yaml
  - file://tests/batching.yaml
  - file://tests/report-issue.yaml
