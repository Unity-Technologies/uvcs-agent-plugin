name: Release

# One button, in the development repository: Actions ▸ Release ▸ Run workflow on main, pick the
# bump (or `gh workflow run release.yml -f bump=patch`). Two jobs, one per repository:
#
#   release  (development repository) bumps "version" in both manifests — plugin.json (Agent
#            Plugins 1.0) and .claude-plugin/plugin.json (Claude Code) — commits the bump to
#            main and tags v<version>, pushing both with a deploy key (RELEASE_DEPLOY_KEY).
#            Unlike a GITHUB_TOKEN push, a deploy-key push starts other workflows, so
#            mirror.yml then carries main and the tag to the public repository.
#   publish  (public repository) runs when that tag arrives: it packages the plugin and
#            publishes the GitHub Release with notes built from the merge commits.
#
# The bump goes straight to main, not through a pull request: deploy keys are on the bypass
# list of the main ruleset (GitHub Actions itself cannot be), which is safe only because nobody
# but the maintainers' team has write access here. Anyone with write access can dispatch a
# workflow from a branch, and a branch copy of this file could push anything to main with that
# key — so if write access is ever granted more widely, take deploy keys off the bypass list and
# go back to a bump pull request.
#
# Why the bump lands on main and not only on a tag: the marketplace entry's source is "./", so
# Claude Code reads the version from main, and an install updates only when that version
# changes.
#
# The notes are built from the merge commits between the previous tag and this one, not by
# GitHub's --generate-notes: pull requests merge in the development repository, so in the
# public one GitHub finds none to list. A merge commit's body is the pull request title.
#
# Retrying: the push is atomic, so a failed run left nothing behind — run it again. If the
# mirror run after it failed, re-run that (Actions ▸ Mirror ▸ Run workflow). In the public
# repository, Run workflow on main publishes the current version's tag if it has no release yet.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (development repository; ignored in the public one)
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.repository != 'Unity-Technologies/uvcs-agent-plugin' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # every tag, to refuse a version that is already tagged
          persist-credentials: false # the push below uses the deploy key, not GITHUB_TOKEN

      - name: Bump both manifests
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current=$(jq -r '.version' plugin.json)
          claude_current=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ "$current" != "$claude_current" ]; then
            echo "::error::plugin.json says $current, .claude-plugin/plugin.json says $claude_current." && exit 1
          fi
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$current is not a plain major.minor.patch version." && exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged." && exit 1
          fi

          for m in plugin.json .claude-plugin/plugin.json; do
            jq --arg v "$version" '.version = $v' "$m" > "$m.tmp" && mv "$m.tmp" "$m"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::RELEASE_DEPLOY_KEY is not set." && exit 1
          fi
          key="$RUNNER_TEMP/release_key"
          ( umask 077; printf '%s\n' "$RELEASE_KEY" > "$key" )
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Release v$VERSION" plugin.json .claude-plugin/plugin.json
          git tag -a "v$VERSION" -m "Release v$VERSION"
          # Atomic: main and the tag land together or not at all. Rejected if main moved
          # since the checkout — run again.
          git push --atomic "git@github.com:$GITHUB_REPOSITORY.git" HEAD:refs/heads/main "refs/tags/v$VERSION"
          echo "::notice::Tagged v$VERSION; the mirror carries it to the public repository, which publishes it."

  publish:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'Unity-Technologies/uvcs-agent-plugin' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, to find the previous tag for the notes

      - name: Pick the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r '.version' plugin.json)"
          fi
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            || { echo "::error::$tag does not exist here yet. Has mirror.yml run?"; exit 1; }

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already has a release — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "skip=false"; echo "tag=$tag"; echo "version=${tag#v}"; } >> "$GITHUB_OUTPUT"

      # git archive ships exactly what is committed, minus the paths marked
      # export-ignore in .gitattributes (CI config, evals, agent guidance). The
      # zip unpacks into a single unity-version-control/ directory, which is what
      # a client's plugin/skills install path expects.
      - name: Package the plugin
        id: package
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          asset="unity-version-control-$VERSION.zip"
          git archive --format=zip --prefix=unity-version-control/ -o "$asset" "$TAG"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Write the notes
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            echo "## What's changed"
            echo
            # First-parent merges are the merged pull requests. With GitHub's default
            # message the subject is "Merge pull request #N from ..." and the title is
            # the first line of the body; a merge written by hand puts the title in the
            # subject, often with " (#N)" after it. The version bump is not a merge, so
            # it never appears.
            for c in $(git log --first-parent --merges --format=%H "$range"); do
              subject=$(git log -1 --format=%s "$c")
              case "$subject" in
                "Merge pull request #"*) git log -1 --format=%b "$c" | awk 'NF { print; exit }' ;;
                *) printf '%s\n' "$subject" | sed -E 's/ \(#[0-9]+\)$//' ;;
              esac
            done | grep -v '^Release v[0-9]' | sed 's/^/- /' || true
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --latest \
            --title "$TAG" \
            --notes-file notes.md \
            "$ASSET" "$ASSET.sha256"
