name: Release

# Releases are cut from main, in two steps:
#
#   1. A pull request bumps "version" in both manifests — plugin.json (Agent
#      Plugins 1.0) and .claude-plugin/plugin.json (Claude Code). It goes through
#      review and the merge queue like any other change; validate-skills fails it
#      if the two manifests disagree.
#   2. When that bump lands on main, this workflow tags v<version>, packages the
#      plugin (everything except repo-only files, see .gitattributes) as a zip
#      plus a SHA-256 checksum, and opens a draft GitHub Release with notes
#      generated from the merged PRs since the previous tag.
#
# You then review the draft on the Releases page and click "Publish release".
#
# Why not bump from here: main only accepts changes through a pull request and
# the merge queue, so a commit pushed by this workflow is rejected (GH013). A PR
# opened with GITHUB_TOKEN does not trigger the required checks either, so it
# could never be queued. Tags are not covered by the branch rules, so tagging
# the commit the queue already merged needs nothing special.
#
# Run it by hand (Actions ▸ Release ▸ Run workflow, on main) to retry a failed
# run. It is a no-op when the tag for the current version already exists.

on:
  push:
    branches: [main]
    paths: [plugin.json, .claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, so generated notes can diff against the last tag

      - name: Read the version and tag it
        id: tag
        run: |
          set -euo pipefail

          version=$(jq -r '.version' plugin.json)
          claude_version=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ "$version" != "$claude_version" ]; then
            echo "::error::plugin.json says $version, .claude-plugin/plugin.json says $claude_version." && exit 1
          fi
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists — nothing to release. Bump the version in a pull request first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # git archive ships exactly what is committed, minus the paths marked
      # export-ignore in .gitattributes (CI config, evals, agent guidance). The
      # zip unpacks into a single unity-version-control/ directory, which is what
      # a client's plugin/skills install path expects.
      - name: Package the plugin
        id: package
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          asset="unity-version-control-$VERSION.zip"
          git archive --format=zip --prefix=unity-version-control/ -o "$asset" "$TAG"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Create draft release with generated notes
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --latest \
            --title "$TAG" \
            "$ASSET" "$ASSET.sha256"
