name: Prepare release

# One button starts a release: Actions ▸ Prepare release ▸ Run workflow, pick the bump (patch,
# minor, major). The run bumps "version" in both manifests, pushes the bump to a release/v<version>
# branch, opens the pull request "Release v<version>" and turns on auto-merge for it: it merges
# itself once its checks pass. When it lands on main, release.yml tags it, mirror.yml carries the
# tag to the public repository, and the release is published there. Auto-merge is per pull
# request: the repository setting "Allow auto-merge" only makes it available, so no other PR
# merges itself.
#
# Why the bump goes through main and not only onto a tag: the marketplace entry's source is "./",
# so Claude Code reads the version from main, and an install updates only when that version
# changes. A version that lives only on a tag never reaches anyone.
#
# Why RELEASE_TOKEN and not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN triggers no
# workflows, so the required checks never report and the PR can never be queued. RELEASE_TOKEN is a
# maintainer's fine-grained personal access token, scoped to this repository only, with Contents
# and Pull requests (read and write). The PR is authored as that maintainer, so another one approves
# it. The token expires: renew it and update the secret when a run fails on authentication.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Development repository only: the public one is a mirror (see mirror.yml) and
    # holds no RELEASE_TOKEN.
    if: >-
      github.repository != 'Unity-Technologies/uvcs-agent-plugin' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Bump both manifests
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current=$(jq -r '.version' plugin.json)
          claude_current=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ "$current" != "$claude_current" ]; then
            echo "::error::plugin.json says $current, .claude-plugin/plugin.json says $claude_current." && exit 1
          fi
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$current is not a plain major.minor.patch version." && exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged." && exit 1
          fi

          for m in plugin.json .claude-plugin/plugin.json; do
            jq --arg v "$version" '.version = $v' "$m" > "$m.tmp" && mv "$m.tmp" "$m"
          done

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The token is only in this step, so it never sits in the environment of one that does not need it.
      - name: Push the bump and open the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CURRENT: ${{ steps.bump.outputs.current }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::$branch already exists: merge or close its pull request, delete the branch, then run again." && exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set." && exit 1
          fi

          # The commit is authored by the token's owner, the same account that opens the PR.
          read -r login id < <(gh api user --jq '"\(.login) \(.id)"')
          git config user.name  "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Release v$VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"

          url=$(gh pr create --base main --head "$branch" --title "Release v$VERSION" --body "$(cat <<EOF
          Bumps \`version\` from $CURRENT to $VERSION in \`plugin.json\` and \`.claude-plugin/plugin.json\`.

          Auto-merge is on: this merges itself once its checks pass. When it lands on main, the Release workflow tags \`v$VERSION\`, the mirror carries it to the public repository, and the release is published there with notes listing the pull requests merged since the last tag.

          Opened by the Prepare release workflow, run by @$GITHUB_ACTOR.
          EOF
          )")
          echo "Release pull request: $url" | tee -a "$GITHUB_STEP_SUMMARY"

          # Already green, this queues it at once; otherwise GitHub queues it when the rest is met.
          gh pr merge "$url" --auto
