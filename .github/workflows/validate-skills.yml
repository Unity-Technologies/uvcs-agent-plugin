name: Validate skills

on:
  # Unfiltered, like Skill evals and for the same reason: a required check that a
  # path filter excludes never reports, and the PR can then never be merged. These
  # jobs cost runner minutes and no API credit, so the trade is easy. Needs no
  # credentials, so it also runs on PRs in the public mirror.
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "skills=$(ls -d skills/*/ | sed 's:/$::' | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  validate-skill:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@39c9da973b7ce3fd4d9632672a0c355bdd733d89 # v1.0.0
        with:
          path: ./${{ matrix.skill }}
          fail-on-warning: "true"
          validate-references: "true"

  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate plugin.json against the Agent Plugins 1.0 schema
        run: pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugin.json

      # The plugin ships two manifests on purpose: the root one is the portable
      # Agent Plugins manifest, .claude-plugin/plugin.json is the one Claude
      # Code actually reads. Duplication is only safe while they agree, and a
      # manifest that disagrees with its marketplace entry is the most common
      # reason a plugin-directory submission is rejected.
      - name: Check the manifests and the marketplace entry agree
        run: |
          set -euo pipefail

          root=$(jq -S '{name, version}' plugin.json)
          claude=$(jq -S '{name, version}' .claude-plugin/plugin.json)
          if [ "$root" != "$claude" ]; then
            echo "::error::plugin.json and .claude-plugin/plugin.json disagree on name/version."
            echo "  plugin.json:                $root"
            echo "  .claude-plugin/plugin.json: $claude"
            echo "  Both are bumped together by .github/workflows/release.yml (Actions > Release)."
            exit 1
          fi

          # The entry names the plugin by its (immutable) slug and leaves the
          # version to the manifest, so a release only has to move two files.
          name=$(jq -r '.name' plugin.json)
          jq -e --arg name "$name" '
            (.plugins | map(select(.name == $name)) | length == 1)
            and (.plugins[] | select(.name == $name) | has("version") | not)
          ' .claude-plugin/marketplace.json > /dev/null || {
            echo "::error::.claude-plugin/marketplace.json must contain exactly one entry named '$name', and that entry must not carry a 'version' (the manifest is the authority)."
            exit 1
          }

  # The one check name the branch rules require from this workflow. `validate-skill`
  # is a matrix generated from the skills/ directory, so its check names carry the
  # skill in them and change whenever a skill is added or renamed — requiring those
  # by name would block every pull request the moment the set moved, because a
  # required check that stops reporting is indistinguishable from one still running.
  # This job's name does not move. `if: always()` so it reports a real result even
  # when something upstream failed or was skipped.
  validate-complete:
    needs: [validate-skill, validate-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to have succeeded
        env:
          SKILLS: ${{ needs.validate-skill.result }}
          MANIFEST: ${{ needs.validate-manifest.result }}
        run: |
          set -euo pipefail
          echo "validate-skill=$SKILLS validate-manifest=$MANIFEST"
          if [ "$SKILLS" != "success" ] || [ "$MANIFEST" != "success" ]; then
            echo "::error::A validation job did not succeed (see the jobs above)."
            exit 1
          fi
