name: Skill evals

# Runs the promptfoo eval suite on every pull request and every merge group.
#
# WHERE THE SUITE ACTUALLY RUNS, and why there are three cases:
#
#   pull_request, branch in this repo   runs now, with the repo's credentials.
#                                       Fast feedback before review.
#   pull_request, fork or dependabot    skipped, cleanly. GitHub withholds Actions
#                                       secrets (and OIDC tokens) from both, so the
#                                       job could only fail on an empty credential —
#                                       a red X that says nothing. Skipping also
#                                       keeps drive-by PRs from spending API credit.
#   merge_group                         always runs, with the repo's credentials.
#                                       This is the real gate: the merge queue builds
#                                       the branch in THIS repo, so secrets are
#                                       issued, and it is the only run that tests the
#                                       change rebased on the current base branch.
#
# So an outside contributor's (or Dependabot's) PR is verified when a maintainer
# queues it, paid for by this repo's credentials, with no Dependabot secret and no
# pull_request_target. Mark this job's check required on the protected branch or the
# merge_group run gates nothing; a required check must also appear under `on:` for
# merge_group or the queue waits for a status that never arrives.
#
# Trusted PRs therefore run their evals twice. Kept deliberately: the queue run is the
# only one that sees the rebase, and skipping it would mean resolving the merge group
# back to a PR through the API — a lookup that fails by merging unverified.
#
# Each run evaluates only the tests the change can reach (evals/reachable-tests.cjs):
# every test is one independent prompt built from its own files, so the others can only
# re-roll their noise. A change no test loads (a README fix) runs none and passes.
#
# Those reached tests are BURNED IN: 8 runs each, 7 must pass (run-evals.sh --burn-in),
# because the change can move them and one sample cannot tell a 95% test from a 60% one.
# A change that reaches every test (the config, the runner, this workflow) runs the suite
# once with retries instead, and burns in only the tests it adds or edits. Either way a
# scenario without margin fails the pull request that wrote it, not a later stranger's
# queue run. Measured in CI on purpose: a local run signs in through Claude Code, whose
# system prompt CI does not have, and it has passed 8/8 a test that CI passed 2/4.
#
# Auth has two interchangeable paths, selected by the ANTHROPIC_AUTH repository
# variable — both end at the same place (credentials in the environment promptfoo
# reads), so nothing else in the job or in evals/ knows which one ran:
#
#   api-key  the ANTHROPIC_API_KEY secret, exported as-is. Current setting.
#   wif      Anthropic Workload Identity Federation: the job exchanges its GitHub
#            OIDC token for a short-lived access token; no secret is stored.
#
# WIF is the intended end state and its step below is untouched. It is not in use
# because the federated service account resolves to an organization with no API
# credits ("Your credit balance is too low to access the Anthropic API", 400) —
# an account/billing problem outside this repo. Switching back once that is fixed
# is two clicks: set ANTHROPIC_AUTH to `wif` and delete the ANTHROPIC_API_KEY
# secret. See evals/README.md.

on:
  # Deliberately unfiltered, on both events. A path filter is a deadlock: a required
  # check that is filtered out never reports at all, so a PR touching neither skills/
  # nor evals/ — a README fix — could never be queued. The job always runs, and the
  # "Select" step below decides which tests, if any, the change can reach.
  pull_request:
  merge_group:
  # Manual runs — handy to verify the auth setup without opening a PR, and the way a
  # contributor can run the suite in their own fork with their own key. With `burn_in`,
  # the way to measure a scenario where it counts, on any branch, HEAD and yours alike:
  #   gh workflow run skill-evals.yml --ref <branch> -f burn_in='^(?:<description>)$'
  workflow_dispatch:
    inputs:
      burn_in:
        description: "Burn in only the tests whose description matches this regex (8 runs each). Empty: the whole suite."
        required: false
        default: ""
  # The whole suite once a week: pull requests run only the tests they reach, so this is
  # what notices a drift no file change caused (the hosted model or the judge changing).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  id-token: write # required to request the GitHub OIDC token (wif mode only)
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    # Second clause: skip the PR run when no credential will be issued to it — a fork
    # head, or Dependabot. Dependabot needs its own test even though its branch lives
    # in this repo: GitHub treats its runs as untrusted and withholds Actions secrets
    # from them, and re-running as a maintainer does not lift that. Both are covered
    # by the merge_group run instead, which is why `github.event_name != 'pull_request'`
    # lets merge_group and workflow_dispatch straight through.
    #
    # First clause: in wif mode the job skips itself until the federation variables are
    # set (`secrets` is not available in a job-level `if`, which is why the mode is a
    # variable rather than "is the key secret present"). Note this skips the merge_group
    # run too, so a misconfigured variable turns the gate green without running it —
    # check the variables after any change to them.
    if: >-
      (vars.ANTHROPIC_AUTH == 'api-key' || vars.ANTHROPIC_FEDERATION_RULE_ID != '') &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    env:
      ANTHROPIC_AUTH: ${{ vars.ANTHROPIC_AUTH || 'wif' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 for its bundled npm 11, which must match the npm that writes
      # evals/package-lock.json: npm 10 (bundled with Node 22) insists the nested
      # mongodb's *optional* peer deps be present in the lock, npm 11 prunes them,
      # and `npm ci` rejects a lock built by the other one. promptfoo 0.122.2 also
      # requires node >=22.22.0, so Node 22 sat right on its floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # promptfoo's dependency tree is large; a cold `npx promptfoo@latest` costs
      # ~2 minutes per run. Pinning the version in evals/package-lock.json and
      # caching node_modules makes warm runs skip the install entirely.
      - name: Restore promptfoo install
        id: pf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/node_modules
          key: promptfoo-${{ runner.os }}-${{ hashFiles('evals/package-lock.json') }}

      - name: Install promptfoo (cache miss only)
        if: steps.pf-cache.outputs.cache-hit != 'true'
        working-directory: evals
        run: npm ci --no-audit --no-fund --loglevel=error

      # Save before running the evals: the combined cache action only saves when
      # the whole job succeeds, so a failing eval would re-install forever.
      - name: Save promptfoo install cache
        if: steps.pf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/node_modules
          key: promptfoo-${{ runner.os }}-${{ hashFiles('evals/package-lock.json') }}

      # Which tests the change can reach, from the files it changes against its base: the
      # pull request's base, or the queue's base for the merge group (which holds every PR
      # queued ahead too). A manual or scheduled run takes the whole suite. Renames list
      # both names; -z and quotePath=false keep any file name exactly as written. The diff
      # is captured before it is split so a failing git fails the step (set -e does not see
      # a process substitution), and an empty list selects everything: it fails closed.
      #
      # Outputs: `tests` (all | none | regex) is what the change reaches; `burn_in` (none |
      # regex) is what runs 8 times. A regex selection is burned in whole; with `all`, the
      # suite runs once and only the added or edited tests are burned in.
      - name: Select the evals this change can reach
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MEASURE: ${{ github.event.inputs.burn_in }}
        run: |
          set -euo pipefail
          node --test evals/reachable-tests.test.cjs evals/suite-rules.test.cjs
          if [ -n "${MEASURE:-}" ]; then
            printf 'tests=none\nburn_in=%s\n' "$MEASURE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ]; then
            printf 'tests=all\nburn_in=none\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          git -c core.quotePath=false diff -z --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"
          mapfile -d '' -t CHANGED < "$RUNNER_TEMP/changed"
          printf 'Changed: %s\n' "${CHANGED[@]}"
          TESTS=$(node evals/reachable-tests.cjs "${CHANGED[@]}")
          if [ "$TESTS" = all ]; then
            BURN_IN=$(node evals/reachable-tests.cjs --edited-since "$BASE")
          else
            BURN_IN=$TESTS
            TESTS=none
          fi
          echo "Whole suite: $TESTS"
          echo "Burn-in: $BURN_IN"
          {
            echo "tests<<__TESTS__"
            echo "$TESTS"
            echo "__TESTS__"
            echo "burn_in<<__TESTS__"
            echo "$BURN_IN"
            echo "__TESTS__"
          } >> "$GITHUB_OUTPUT"
          if [ "$TESTS" = none ] && [ "$BURN_IN" = none ]; then
            echo "No eval loads a file this change touches; none ran." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Both auth steps run AFTER `npm ci`, and must stay there. Written into
      # GITHUB_ENV before the install, the credential is in the environment of every
      # install script in promptfoo's tree (sharp, esbuild, @swc/core,
      # onnxruntime-node and more). A lockfile change always misses the node_modules
      # cache, so that would fire on exactly the dependency PRs worth worrying about.

      - name: Use the ANTHROPIC_API_KEY secret
        if: env.ANTHROPIC_AUTH == 'api-key' && (steps.select.outputs.tests != 'none' || steps.select.outputs.burn_in != 'none')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_AUTH is 'api-key' but the ANTHROPIC_API_KEY secret is empty (set it, or set ANTHROPIC_AUTH to 'wif')"
            exit 1
          fi
          # promptfoo picks this up on its own; no custom headers, so it must not
          # inherit the x-api-key-shadowing header the wif path sets.
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> "$GITHUB_ENV"

      - name: Exchange GitHub OIDC token for an Anthropic access token
        if: env.ANTHROPIC_AUTH == 'wif' && (steps.select.outputs.tests != 'none' || steps.select.outputs.burn_in != 'none')
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          BODY=$(jq -n --arg jwt "$JWT" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg svc "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg ws "${ANTHROPIC_WORKSPACE_ID:-}" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $jwt,
              federation_rule_id: $rule,
              organization_id: $org,
              service_account_id: $svc}
             + (if $ws != "" then {workspace_id: $ws} else {} end)')
          TOKEN=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Anthropic WIF token exchange failed (check the federation rule and the Console authentication history)"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          # WIF tokens are only valid as an Authorization bearer; the API validates
          # x-api-key first if present, so the empty x-api-key line shadows the
          # placeholder key (promptfoo refuses to start with no key at all) and
          # keeps it off the wire.
          {
            echo "ANTHROPIC_CUSTOM_HEADERS<<__HDR__"
            echo "authorization: Bearer $TOKEN"
            echo "x-api-key:"
            echo "__HDR__"
          } >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=wif-placeholder-real-auth-is-bearer-header" >> "$GITHUB_ENV"

      - name: Run promptfoo evals
        if: steps.select.outputs.tests != 'none' || steps.select.outputs.burn_in != 'none'
        working-directory: evals
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
          TESTS: ${{ steps.select.outputs.tests }}
          BURN_IN: ${{ steps.select.outputs.burn_in }}
          # The burn-in is 8 calls a test; it runs twice as wide as the single pass.
          EVAL_CONCURRENCY: "8"
        # The whole suite: every failing test is named and retried 4 times, red below 3.
        # The burn-in: 8 runs a test, red below 7. Both report even if the first fails.
        # Same script locally: evals/run-evals.sh [--burn-in].
        run: |
          status=0
          if [ "$TESTS" = all ]; then
            EVAL_CONCURRENCY=4 ./run-evals.sh || status=1
          fi
          if [ "$BURN_IN" != none ]; then
            ./run-evals.sh --burn-in --filter-pattern "$BURN_IN" || status=1
          fi
          exit $status

      # The full results, for anyone who needs the actual model output behind a
      # failure rather than the assertion reason the summary prints.
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: evals/output/*.json
          if-no-files-found: ignore
          retention-days: 14
