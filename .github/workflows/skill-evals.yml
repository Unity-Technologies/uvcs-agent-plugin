name: Skill evals

# Runs the promptfoo eval suite when skill content (or the suite itself) changes.
#
# Auth has two interchangeable paths, selected by the ANTHROPIC_AUTH repository
# variable — both end at the same place (credentials in the environment promptfoo
# reads), so nothing else in the job or in evals/ knows which one ran:
#
#   api-key  the ANTHROPIC_API_KEY secret, exported as-is. Current setting.
#   wif      Anthropic Workload Identity Federation: the job exchanges its GitHub
#            OIDC token for a short-lived access token; no secret is stored.
#
# WIF is the intended end state and its step below is untouched. It is not in use
# because the federated service account resolves to an organization with no API
# credits ("Your credit balance is too low to access the Anthropic API", 400) —
# an account/billing problem outside this repo. Switching back once that is fixed
# is two clicks: set ANTHROPIC_AUTH to `wif` and delete the ANTHROPIC_API_KEY
# secret. See evals/README.md.

on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - ".github/workflows/skill-evals.yml"
  # Manual runs — handy to verify the auth setup without opening a PR.
  workflow_dispatch:

permissions:
  id-token: write # required to request the GitHub OIDC token (wif mode only)
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    # Neither OIDC tokens nor secrets are issued to fork PRs, so both modes skip
    # them; a maintainer pushes the branch to this repo to run the evals. In wif
    # mode the job also skips itself until the federation variables are set.
    # `secrets` is not available in a job-level `if`, which is why the mode is a
    # variable rather than "is the key secret present".
    if: >-
      (vars.ANTHROPIC_AUTH == 'api-key' || vars.ANTHROPIC_FEDERATION_RULE_ID != '') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      ANTHROPIC_AUTH: ${{ vars.ANTHROPIC_AUTH || 'wif' }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the ANTHROPIC_API_KEY secret
        if: env.ANTHROPIC_AUTH == 'api-key'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_AUTH is 'api-key' but the ANTHROPIC_API_KEY secret is empty (set it, or set ANTHROPIC_AUTH to 'wif')"
            exit 1
          fi
          # promptfoo picks this up on its own; no custom headers, so it must not
          # inherit the x-api-key-shadowing header the wif path sets.
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> "$GITHUB_ENV"

      - name: Exchange GitHub OIDC token for an Anthropic access token
        if: env.ANTHROPIC_AUTH == 'wif'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          BODY=$(jq -n --arg jwt "$JWT" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg svc "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg ws "${ANTHROPIC_WORKSPACE_ID:-}" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $jwt,
              federation_rule_id: $rule,
              organization_id: $org,
              service_account_id: $svc}
             + (if $ws != "" then {workspace_id: $ws} else {} end)')
          TOKEN=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Anthropic WIF token exchange failed (check the federation rule and the Console authentication history)"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          # WIF tokens are only valid as an Authorization bearer; the API validates
          # x-api-key first if present, so the empty x-api-key line shadows the
          # placeholder key (promptfoo refuses to start with no key at all) and
          # keeps it off the wire.
          {
            echo "ANTHROPIC_CUSTOM_HEADERS<<__HDR__"
            echo "authorization: Bearer $TOKEN"
            echo "x-api-key:"
            echo "__HDR__"
          } >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=wif-placeholder-real-auth-is-bearer-header" >> "$GITHUB_ENV"

      # Node 24 for its bundled npm 11, which must match the npm that writes
      # evals/package-lock.json: npm 10 (bundled with Node 22) insists the nested
      # mongodb's *optional* peer deps be present in the lock, npm 11 prunes them,
      # and `npm ci` rejects a lock built by the other one. promptfoo 0.122.2 also
      # requires node >=22.22.0, so Node 22 sat right on its floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # promptfoo's dependency tree is large; a cold `npx promptfoo@latest` costs
      # ~2 minutes per run. Pinning the version in evals/package-lock.json and
      # caching node_modules makes warm runs skip the install entirely.
      - name: Restore promptfoo install
        id: pf-cache
        uses: actions/cache/restore@v6
        with:
          path: evals/node_modules
          key: promptfoo-${{ runner.os }}-${{ hashFiles('evals/package-lock.json') }}

      - name: Install promptfoo (cache miss only)
        if: steps.pf-cache.outputs.cache-hit != 'true'
        working-directory: evals
        run: npm ci --no-audit --no-fund --loglevel=error

      # Save before running the evals: the combined cache action only saves when
      # the whole job succeeds, so a failing eval would re-install forever.
      - name: Save promptfoo install cache
        if: steps.pf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: evals/node_modules
          key: promptfoo-${{ runner.os }}-${{ hashFiles('evals/package-lock.json') }}

      - name: Run promptfoo evals
        working-directory: evals
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
        # Names every failing test and re-runs only those; the job goes red only
        # on a test that fails twice. Same script locally: evals/run-evals.sh.
        run: ./run-evals.sh

      # The full results, for anyone who needs the actual model output behind a
      # failure rather than the assertion reason the summary prints.
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/output/*.json
          if-no-files-found: ignore
          retention-days: 14
