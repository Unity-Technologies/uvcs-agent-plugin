# The field labels below double as the headings of
# skills/uvcs-report-issue/assets/issue-template.md, which is what an agent files with gh
# (an installed plugin never carries .github/, and gh cannot submit a YAML form). GitHub
# renders a submission of this form as "### <label>" sections, so the two stay identical in
# the tracker only while they change together.
name: Bug report
description: A skill gave wrong commands, didn't trigger, or behaved differently in one agent
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security issues here — see
        [SECURITY.md](https://github.com/Unity-Technologies/uvcs-agent-plugin/blob/main/SECURITY.md).

        Using the plugin from an agent? Ask it to *report this as a plugin bug*: the
        `uvcs-report-issue` skill collects everything below, redacts it, shows you the text and
        files it (or hands you the text to paste here).
  - type: input
    id: skill
    attributes:
      label: Which skill
      description: The skill, and the file inside it if you know which.
      placeholder: uvcs-core — references/find-queries.md
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: The AI client you were using.
      placeholder: Claude Code 2.1.0 / Codex CLI 0.9 / Cursor 1.7
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "`version` in `plugin.json`, or how you installed it (`npx skills add`, clone)."
      placeholder: "0.1.6"
    validations:
      required: false
  - type: input
    id: cm-version
    attributes:
      label: cm version
      description: Output of `cm version`.
      placeholder: "11.0.16.8101"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and shell
      description: The shell `cm` ran in matters — quoting differs between them.
      placeholder: macOS 15.2 / zsh — Windows 11 / PowerShell — Ubuntu 24.04 / bash
    validations:
      required: true
  - type: textarea
    id: what-you-asked
    attributes:
      label: What you asked the agent
      description: The prompt, verbatim if possible.
    validations:
      required: true
  - type: textarea
    id: what-skill-says
    attributes:
      label: What the skill says
      description: |
        The lines the agent followed, quoted from the skill or reference file. This pins the
        content regardless of the version installed.
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What the agent did
      description: |
        Commands it ran and output it produced. Trim and anonymize — replace real server names,
        repo names, and user names with placeholders (`<server>`, `<repo>`, `<user>`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: The correct command or behaviour, and how you know (`cm help` output, the GUI, another reference).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, as a test
      description: |
        Every fix lands with an eval, and an eval is one user message with the `cm` output pasted
        into it, plus what the answer must and must not contain. Write it that way if you can.
      placeholder: |
        User message: "Switch me to /main/task002. cm status --header says /main/task001@<repo>@<org>@cloud (cs:4207 - head); cm status shows CH|/wk/src/Player.cs|..."
        Must contain: cm shelveset create --all
        Must not contain: cm undo before the shelve
    validations:
      required: false
  - type: dropdown
    id: other-agents
    attributes:
      label: Does it also happen in another agent?
      description: Portability is a feature here — a one-client failure is a real bug.
      options:
        - "Yes — same failure elsewhere"
        - "No — works in another agent"
        - "Haven't tried"
    validations:
      required: true
